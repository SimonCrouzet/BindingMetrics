# Exact-version snapshot of the developer environment (linux-64, conda-forge,
# CUDA 12.4). Use it to rebuild the environment a result or a bug report came
# from. environment.yml stays the human-edited spec that CI and the Dockerfile
# build from; this file is not read by either.
#
# Recreate:
#   conda env create -n binding-metrics -f environment.lock.yml
#   conda activate binding-metrics
#   pip install --no-deps -e .
#
# Regenerate from a working environment after a deliberate dependency change:
#   conda env export -n binding-metrics --no-builds \
#     | grep -v -E -e '^prefix:' -e '^      - binding-metrics==' \
#         -e '^      - (amberutils|edgembar|mmpbsa-py|packmol-memgen|pdb4amber|pymsmt|pytraj|sander)==' \
#     > body.yml
#   then keep this header on top of body.yml.
# The filter drops the machine-specific prefix line, the editable install of
# this package, and the egg-info entries that the conda ambertools package ships
# inside site-packages (pip would try to fetch those from PyPI).
