[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binding-metrics"
version = "0.1.0"
description = "GPU-compatible Python package for evaluating biologics binding metrics through MD simulations"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "BindingMetrics Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
simulation = ["openmm>=8.0"]  # plain CPU build; for GPU use environment.yml
analysis   = ["mdtraj>=1.9"]
structure  = ["pdbfixer>=1.9", "gemmi>=0.6"]
biotite    = ["biotite>=0.41", "hydride", "scipy>=1.10"]
# Everything the static (single-structure) metrics import: biotite for SASA,
# interface, electrostatics, geometry and H-bond/salt-bridge counting; hydride to
# add hydrogens for the H-bond count; gemmi for structure comparison and the
# OpenFold/mmCIF handling; scipy for the KD-tree searches and void-volume grid
# labelling in the geometry and receptor-quality metrics.
static     = ["biotite>=0.41", "hydride", "gemmi>=0.6", "scipy>=1.10"]
# OpenFold3 is imported as `openfold3` and installed with `pip install openfold3`
# (binding-metrics-check-env, environment_openfold3.yml); the metrics call its
# `run_openfold` command and never import it. `openfold` is the extra name that
# the missing-dependency message of binding_metrics/__init__.py gives and
# `openfold3` an alias for it. Both suit the dedicated OpenFold3 environment.
openfold   = ["openfold3"]
openfold3  = ["openfold3"]
dockq      = ["DockQ>=2.0"]  # reference-based CAPRI metrics (MIT licensed)
# Intentionally empty: openmmforcefields, openff-toolkit, ambertools and rdkit
# (the GAFF2 route for non-standard residues) are conda-forge only and cannot be
# expressed as pip requirements. Install them with environment.yml. The extra
# stays defined so `pip install binding-metrics[gaff]` does not warn about an
# unknown extra.
gaff       = []
all = [
    "openmm>=8.0",
    "mdtraj>=1.9",
    "pdbfixer>=1.9",
    "gemmi>=0.6",
    "biotite>=0.41",
    "hydride",
    "scipy>=1.10",
    "DockQ>=2.0",
    "pandas>=1.5",
    "markdown>=3.4",
    # openmmforcefields + openff-toolkit are conda-forge only; install via environment.yml
]
# pandas is read by binding-metrics-energy (CSV), markdown by the HTML summary.
report = ["pandas>=1.5", "markdown>=3.4"]
dev    = ["pytest>=7.0", "ruff==0.15.21"]  # keep equal to ci.yml and .pre-commit-config.yaml

[project.scripts]
binding-metrics-check-env = "binding_metrics.cli.check_env:main"
binding-metrics-run      = "binding_metrics.cli.run:main"
binding-metrics-batch    = "binding_metrics.cli.batch:main"
binding-metrics-relax = "binding_metrics.protocols.relaxation:main"
binding-metrics-energy = "binding_metrics.metrics.energy:main"
binding-metrics-interface = "binding_metrics.metrics.interface:main"
binding-metrics-compare = "binding_metrics.metrics.comparison:main"
binding-metrics-dockq = "binding_metrics.metrics.dockq:main"
binding-metrics-openfold = "binding_metrics.metrics.openfold:main"
binding-metrics-electrostatics = "binding_metrics.metrics.electrostatics:main"
binding-metrics-geometry  = "binding_metrics.metrics.geometry:main"
binding-metrics-receptor-quality = "binding_metrics.metrics.receptor_quality:main"
binding-metrics-prep      = "binding_metrics.protocols.prep:main"
binding-metrics-solvate   = "binding_metrics.protocols.solvate:main"
binding-metrics-report    = "binding_metrics.protocols.report:main"

[project.urls]
Homepage = "https://github.com/SimonCrouzet/BindingMetrics"
Repository = "https://github.com/SimonCrouzet/BindingMetrics"

[tool.setuptools.packages.find]
where = ["src"]

# The 1YCR complex that binding_metrics.testing.make_synthetic_poses reads. `data/` is not a
# package (no __init__.py), so the pattern is relative to the testing package directory.
[tool.setuptools.package-data]
"binding_metrics.testing" = ["data/*.pdb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B: flake8-bugbear. BLE: blind ``except Exception``, which must name why it is broad
# (``# noqa: BLE001 - <reason>``) or catch the specific exceptions.
select = ["B", "BLE", "E", "F", "I", "N", "W"]
# N806/N803/N815 fight established scientific notation. Atom, residue and
# matrix names are read against the literature (CA, CB, OD2, dG, dSASA, R_gyr),
# and lower-casing them to satisfy pep8-naming makes the code harder to check
# against the papers it implements.
# B905 asks for ``strict=`` on every ``zip``. The zips here pair parallel atom
# arrays, and each site needs its own decision: ``strict=True`` turns today's
# silent truncation into an exception, so the rule stays off until each is reviewed.
ignore = ["N806", "N803", "N815", "B905"]

[tool.ruff.lint.per-file-ignores]
# Re-exports: the public surface is defined by what __init__ imports.
"src/binding_metrics/**/__init__.py" = ["F401"]
# Frozen snapshots of superseded code, kept for provenance, not maintained.
"archive/**" = ["ALL"]
# Test names spell out the case under test, including chain IDs and units
# (test_chain_R_works, test_delta_g_int_kJ_consistent). Lower-casing them
# loses the distinction from chain r or kcal.
"tests/**" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# --strict-markers turns a typo'd marker into a collection error instead of a
# silently-never-selected test; --strict-config does the same for this table.
addopts = "--strict-markers --strict-config"
# A DeprecationWarning attributed to a binding_metrics module (the package's own code using a
# deprecated name, or calling a deprecated function) fails the test; a test that provokes one
# on purpose says so with pytest.warns. Later entries take precedence over earlier ones.
# OpenMM 8.2 warns on every import ("builtin type SwigPyPacked has no __module__ attribute");
# the first entry ignores it by message, because that warning as an error makes the import of
# OpenMM segfault (tests/conftest.py guards its own import as well).
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "error::DeprecationWarning:binding_metrics.*",
]
markers = [
    "integration: exercises real structures and the full OpenMM/biotite stack, not mocks",
    "gpu: requires a CUDA device — skipped on CPU-only machines and in CI",
    "slow: takes minutes; excluded from the default developer loop",
    "openfold: runs the parsers of an installed OpenFold3 (conda env openfold3, CPU only); skipped when absent",
    # Areas of the code a test file is about, added by tests/conftest.py from its imports and the
    # names it uses (tests/_areas.py): `pytest -m poses_frame` runs one, `pytest -m poses` the
    # whole coarse area. Keep this list equal to AREA_DESCRIPTIONS there: tests/test_area_tags.py
    # compares them.
    "cli: all command-line entry points: run, batch, check-env and the shared flags",
    "cli_batch: binding-metrics-batch (cli/batch.py)",
    "cli_env: the shared command-line flags and binding-metrics-check-env (cli/__init__.py)",
    "cli_prediction: the --predictor step of run and batch (cli/prediction.py)",
    "cli_run: binding-metrics-run and the pipeline behind it (cli/run.py)",
    "core: system preparation, force fields, simulation, GAFF, cyclic and non-standard residues",
    "core_cyclic: head-to-tail, disulfide, lactam and staple closures (core/cyclic.py)",
    "core_gaff: GAFF2 parameters of non-standard residues and phospho-residues",
    "core_residues: residue name tables, D-amino acids, N-methylated residues",
    "core_system: system preparation, force-field set-up and simulation (core/system.py)",
    "io: reading and writing structures (load_structure, save_cif, chain detection)",
    "metrics: the static and MD metrics and their registry",
    "metrics_common: helpers shared by the metrics: structure loader, chain aliases, OpenMM",
    "metrics_comparison: RMSD against a reference and DockQ",
    "metrics_energy: interaction energy, the Coulomb term and the MLFF energy",
    "metrics_evobind: the EvoBind score and its adversarial check",
    "metrics_geometry: Ramachandran, omega planarity, shape complementarity, void volume",
    "metrics_interface: interface residues, contacts, hydrogen bonds and salt bridges",
    "metrics_receptor: receptor quality and receptor drift",
    "metrics_registry: the metric registry, its metadata and its documentation",
    "metrics_sasa: buried and static solvent-accessible surface area",
    "of3: the OpenFold3 route: its run, templates, flags, adapter and runner",
    "of3_adapter: the OpenFold3 output adapter (predictors/of3.py)",
    "of3_run: running OpenFold3 and reading its result (metrics/openfold.py, the runner)",
    "of3_templates: OpenFold3 template modes and their command-line flags",
    "package: the package root, constants, logging setup and provenance",
    "package_exports: lazy exports and the version of the package root",
    "package_support: constants, logging setup and provenance of result files",
    "poses: the pose layer (kinds, reference, scoring, pose-set reports) and the testing package",
    "poses_agreement: agreement between poses, aggregation and symmetry",
    "poses_descriptors: reference-site descriptors and the reference (poses/descriptors.py)",
    "poses_frame: the common frame of a pose set (poses/frame.py)",
    "poses_pose: the pose kinds and the synthetic pose sets",
    "poses_score: scoring a pose set, its report and the reconciliation of two back-ends",
    "predictors: model adapters, runners, the prediction store and session (OpenFold3 aside)",
    "predictors_af2: the AlphaFold2 and ColabFold adapter and runner",
    "predictors_base: the adapter contract: base class, registry, record, confidence helpers",
    "predictors_boltz2: the Boltz-2 adapter and runner",
    "predictors_protenix: the Protenix adapter and runner",
    "predictors_store: the run-once store, session, manifest, runners and weights",
    "preflight: what a model or metric accepts and the check of an input before a run",
    "preflight_capabilities: the declared limits of steps and models and the pre-flight check",
    "preflight_cli: the pre-flight check of the command-line pipeline (preflight_cli.py)",
    "protocols: relaxation, preparation, solvation, structural QC and the report",
    "protocols_qc: structural QC of relaxed structures",
    "protocols_relaxation: relaxation, preparation and solvation protocols",
    "protocols_report: the report and its plots",
    "docs: the text of docs/, README.md and CHANGELOG.md, checked against the code",
    "golden: comparisons with stored reference output (tests/golden, OpenFold3 golden files)",
    "misc: tests that import nothing from the package",
]
