version: 2

# GitHub Actions only. The scientific stack lives in environment.yml and comes
# from conda-forge, which Dependabot cannot read — pointing it at pyproject.toml
# as a "pip" ecosystem would raise PRs for versions this project never installs
# that way. Dependency bumps there stay manual and go through environment.yml.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The workflows pin floating majors (@v4), so patches and minors already
    # arrive on their own. What needs a human is a new major — a changed Node
    # runtime or renamed inputs — which is what these PRs will be.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
