version: 2

# GitHub Actions only. The scientific stack lives in environment.yml and comes
# from conda-forge, which Dependabot cannot read — pointing it at pyproject.toml
# as a "pip" ecosystem would raise PRs for versions this project never installs
# that way. Dependency bumps there stay manual and go through environment.yml.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One PR per run carries every action bump, majors included. A grouped
    # update counts as a single open PR against the limit below.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
