name: Build and Push Docker Image

# A version tag is published only after verify-ci.yml: the tag must be v plus
# the project version, and ci.yml must have passed on the tagged commit. A push
# to main is not a release: it moves `main` and `full` and carries no `latest`,
# because ci.yml runs on that commit at the same time and its result is not
# known when this workflow starts. `latest` comes from the metadata action's
# default flavor (latest=auto), which adds it only for a stable version tag,
# that is, only after the verification.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag and CI
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-ci.yml

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for base image
        id: meta-base
        uses: docker/metadata-action@v6
        with:
          images: simoncrouzet/binding-metrics
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata for full image
        id: meta-full
        uses: docker/metadata-action@v6
        with:
          images: simoncrouzet/binding-metrics
          tags: |
            type=raw,value=full,enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-full
            type=semver,pattern={{major}}.{{minor}},suffix=-full

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}

      - name: Build and push full image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          labels: ${{ steps.meta-full.outputs.labels }}
