name: Docker image builds

# docker-publish.yml only runs after a change has landed on main, so a
# Dockerfile or dependency edit that breaks the image is discovered too late.
# This builds the same image on the PR — build only, no registry credentials,
# so it is safe on forked PRs.
#
# Path-filtered because the build takes ~25 minutes: only the inputs that can
# actually break it trigger a run. It is deliberately NOT a required status
# check — a required check that is skipped by a path filter blocks every PR
# that does not touch these files.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "environment.yml"
      - "environment_openfold3.yml"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build base image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The CUDA devel base plus a full conda env overruns the runner's default
      # free space; drop preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      # Only the base target: the full target adds the OpenFold3 ML stack and
      # nearly doubles the image, which does not fit a hosted runner.
      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: base
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
